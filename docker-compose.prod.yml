services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdo-discord-bot-prod
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - bot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Note: Basic healthcheck verifies Node.js process is running
    # Actual Discord bot health is determined by Discord connection status
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  bot-network:
    driver: bridge
