name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Generate coverage report
      run: npm run test:coverage
      if: matrix.node-version == '20.x'
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.node-version == '20.x'
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: test
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Validate docker-compose.yml syntax
      run: |
        docker compose config > /dev/null
        echo "✅ docker-compose.yml syntax is valid"
    
    - name: Validate docker-compose.prod.yml syntax
      run: |
        docker compose -f docker-compose.prod.yml config > /dev/null
        echo "✅ docker-compose.prod.yml syntax is valid"
    
    - name: Create .env for dev build test
      run: cp .env.example .env
    
    - name: Build Docker image
      run: docker build -t bdo-discord-bot:test .
    
    - name: Test docker-compose build (dev)
      run: |
        docker compose build
        echo "✅ docker-compose (dev) build successful"
    
    - name: Test docker-compose build (prod)
      run: |
        docker compose -f docker-compose.prod.yml build
        echo "✅ docker-compose (prod) build successful"

